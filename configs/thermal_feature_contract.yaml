track_level_output_contract:
  planned_path: results/tables/formal_track_thermal_features.csv
  expected_rows: 57
  row_unit: sample_id
  creation_enabled: false
  required_identifier_fields: [sample_id, condition_id, track_id, plate_id, track_order]
  required_process_fields: [laser_power_W, scan_speed_mm_min, magnetic_field_mT, powder_feed_set_g_min, travel_distance_mm]
  required_config_fields: [formal_pipeline_config, roi_strategy_config, physical_calibration_config, thermal_feature_contract_config]

condition_level_output_contract:
  planned_path: results/tables/formal_condition_thermal_responses.csv
  expected_rows: 19
  row_unit: condition_id
  creation_enabled: false
  naming_pattern: feature__stat
  required_stats: [mean, std, cv, n_valid]

aggregation_policy:
  track_to_condition:
    group_by: condition_id
    repeats: [T1, T2, T3]
    concatenate_repeats: false
    cross_condition_aggregation: false
    silent_repeat_deletion: false
  statistics:
    mean: arithmetic_mean_over_valid_track_values
    std: sample_standard_deviation_ddof_1
    n_valid: count_valid_track_values
    cv: std / abs(mean)
    cv_requires_n_valid_at_least: 2
    cv_near_zero_mean_policy: NaN_with_status_flag

