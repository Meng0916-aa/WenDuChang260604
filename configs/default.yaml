# ============================================================
# Magnetic-Field-Assisted Laser Cladding
# Default Configuration
# ============================================================

# Global random seed (reproducibility — see src/utils/seed.py)
seed: 42

# --- Physical calibration (formal spatial scale) ---
# The formal spatial + temperature calibration lives in its own file. Formal
# ROI / feature programs MUST read the pixel size from there
# (src/config/physical_calibration.py), NOT from the legacy `pixel_size_mm`
# under thermal_field_features below.
calibration:
  config_file: configs/physical_calibration.yaml

# --- Paths ---
paths:
  raw_xtherm: "data/raw_xtherm"
  exported_csv: "data/exported/csv"
  exported_npy: "data/exported/npy"
  exported_h5: "data/exported/h5"
  processed_matrix: "data/processed/matrix"
  processed_roi: "data/processed/roi"
  processed_thermal_cycle: "data/processed/thermal_cycle"
  processed_samples: "data/processed/samples"
  metadata: "data/metadata"
  results_figures: "results/figures"
  results_tables: "results/tables"
  results_logs: "results/logs"
  results_checkpoints: "results/checkpoints"

# --- Data ---
data:
  temperature_scale: 0.1      # raw_value -> Celsius: T = raw * scale
  unit: "Celsius"
  dtype: "float32"
  shape_format: "NCHW"        # N = frames, H = height, W = width
  valid_range: [0.0, 3000.0]  # valid Celsius range
  # If exported matrices are already in Celsius, set true so 02 does NOT
  # divide by 10 again. If they are still raw digital counts, set false.
  # NOTE: script 02b (xtherm_binary) already applies scale_factor=0.1, so its
  # output dataset.npy IS Celsius -> keep true when feeding 02b output into 02.
  exported_is_celsius: true
  # Real-data shape contract enforced by 02_convert_exported_to_npy.py.
  # Inputs that violate this raise an explicit error (no silent reshape).
  expected_ndim: 3            # require N x H x W (a single H x W frame is auto-expanded)
  expected_axis_order: "NHW"  # documents the axis meaning of the exported array
  expected_frame_axis: 0      # frames MUST be axis 0 (N x H x W). Only 0 is supported.
  expected_height: null       # if set, axis 1 (H) must equal this exactly
  expected_width: null        # if set, axis 2 (W) must equal this exactly
  min_frames: 2               # a multi-frame array with N < this is rejected
                              # (a genuine single H x W frame is still allowed)
  # Metadata lives in a Markdown template (docs/metadata_template.md) so it is
  # NOT swept up by the *.csv gitignore rule. This path is optional.
  metadata_file: "experiments.md"   # under paths.metadata (optional)

# --- Binary .xtherm -> npy conversion (script 02b) ---
# Format verified empirically on real WeldStudio exports (2026-06):
#   file size = header_bytes + width*height*2  (655416 = 56 + 640*512*2)
#   little-endian uint16; T_celsius = raw / 10. Big-endian reads give ~6500 C
#   on the first frame -> wrong, do NOT use big-endian.
xtherm_binary:
  input_dir: "data/raw_xtherm/dataset"
  output_npy: "data/exported/npy/dataset.npy"
  output_meta: "data/exported/npy/dataset_meta.json"
  sample_id: "dataset"
  width: 640
  height: 512
  header_bytes: 56
  dtype: "uint16"
  endian: "little"
  scale_factor: 0.1
  # zero pixels (0.0 C) above this fraction trigger a NOTE (not an error);
  # edge zeros are usually invalid pixels or background.
  zero_ratio_note_threshold: 0.05

# --- ROI ---
roi:
  enabled: true
  # Preferred: top/left/height/width (pixels). top=row, left=column.
  # If height or width is null, the legacy `bounds` field is used instead.
  top: 200
  left: 0
  height: 300        # rows kept: top .. top+height-1
  width: 600         # cols kept: left .. left+width-1
  # Legacy fallback: pixel coordinates [x1, y1, x2, y2] (x=col, y=row).
  bounds: [100, 80, 400, 350]
  save_intermediate: true

# --- Thermal Cycle ---
thermal_cycle:
  tmax: true
  center_average_radius: 5          # pixel radius around frame center
  center_window: 5                  # alias of center_average_radius (px)
  hot_zone_threshold_celsius: 800.0
  hot_zone_threshold: 800.0         # alias of hot_zone_threshold_celsius (C)
  output_format: "csv"
  # Columns written to each thermal-cycle CSV (besides the frame index).
  output_columns: ["tmax", "center_average", "hot_zone_average"]

# --- Dataset ---
dataset:
  input_window: 30          # number of past frames
  predict_window: 10        # number of future frames to predict
  step: 1                   # stride between samples
  val_ratio: 0.15
  test_ratio: 0.15
  split_by_experiment: true
  shuffle_train: true
  # Which thermal-cycle curves become input features (subset of:
  # tmax | center_average | hot_zone_average). The FIRST entry is the
  # prediction target; the rest are auxiliary input features.
  feature_columns: ["tmax"]
  samples_file: "window_samples.npz"   # saved under paths.processed_samples

# --- Normalization ---
# Statistics are fit on the TRAINING split only and saved to
# results/checkpoints/normalizer.npz. Evaluation loads them and inverse-
# transforms predictions back to Celsius before computing metrics.
normalization:
  enabled: true
  method: "standard"        # standard (z-score). Only "standard" is implemented.
  eps: 1.0e-8               # numerical floor for per-channel std

# --- Model ---
model:
  name: "lstm"              # lstm | tcn | transformer | lstm_tcn
  input_dim: 1              # channels per pixel (1 = temperature only)
  hidden_dim: 64
  num_layers: 2
  dropout: 0.2
  # LSTM-specific
  lstm:
    bidirectional: true
  # TCN-specific
  tcn:
    kernel_size: 3
    num_channels: [64, 64, 64, 64]
  # Transformer-specific
  transformer:
    nhead: 4
    dim_feedforward: 256

# --- Training ---
training:
  loss: "mse"              # main loss (mse). mae also available.
  batch_size: 32
  epochs: 100
  learning_rate: 0.001
  weight_decay: 1.0e-5
  patience: 15              # early stopping patience
  gradient_clip: 1.0
  device: "auto"            # auto | cpu | cuda (auto -> cuda if available)

# --- Evaluation ---
evaluation:
  metrics: ["rmse", "mae", "waveform_similarity"]
  per_frame_metrics: true
  save_predictions: true
  predictions_file: "lstm_predictions.csv"   # under results_tables
  metrics_file: "lstm_metrics.csv"
  metrics_by_group_file: "lstm_metrics_by_magnetic_group.csv"
  group_by_experiment: true

# --- Magnetic Field Groups ---
magnetic_field_groups:
  with_magnetic_field:
    experiment_ids: []
    label: "with_B"
  without_magnetic_field:
    experiment_ids: []
    label: "without_B"

# --- Process Parameters (optional auxiliary inputs) ---
# When enabled, per-experiment scalars (e.g. laser power, scan speed,
# magnetic-field flag) are concatenated onto every input time step,
# enlarging the model input_dim. Disabled by default.
process_params:
  enabled: false
  columns: []              # e.g. ["laser_power", "scan_speed", "magnetic_field"]
  by_experiment: {}        # e.g. { SIM_000: [1500.0, 5.0, 1.0], ... }

# --- Simulation (fallback self-test data) ---
# Only used by 05_build_window_dataset.py when no real thermal-cycle CSVs
# exist under paths.processed_thermal_cycle. Generates clearly-labelled
# SIMULATED curves so the training/eval code chain can be exercised.
# Simulated numbers are NOT experimental results.
simulation:
  enabled: true
  n_experiments: 6
  n_frames: 400
  seed: 42
  # Reminder: SIMULATED data is ONLY for validating the code chain. It does
  # NOT represent any real experiment. Figures/tables derived from it are
  # tagged SIMULATED and must not be cited as experimental conclusions.

# --- Visualization ---
visualization:
  output_dir: "results/figures"   # mirrors paths.results_figures
  dpi: 200
  save_png: true
  save_pdf: true
  # Number of test samples to plot true/pred/error curves for.
  num_curve_samples: 3
  figsize: [8, 4]

# --- Temporal Feature Analysis (script 09) ---
# Extracts time-series features from thermal-cycle curves (output of script 04)
# for Chapter-3 analysis. Independent of the dataset/training frame settings.
temporal_analysis:
  frame_rate_fps: 1000          # frames per second; sets the time axis (seconds)
  smooth_window: 5              # moving-average window (<=1 disables smoothing)
  dwell_threshold: 800.0        # Celsius; dwell time counts frames >= this
  max_examples_to_plot: 3       # number of typical curve+derivative plots
  input_dir: "data/processed/thermal_cycle"
  output_table: "results/tables/temporal_features.csv"
  output_figure_dir: "results/figures"

# ============================================================
# Machine-Learning Quality Assessment (main line for small samples)
# Scripts 10 -> 11 -> 12. Extract per-experiment thermal-field features,
# merge with cross-section quality labels, train traditional ML models.
# ============================================================

# --- Thermal-field feature extraction (script 10) ---
# One ROI temperature matrix (N x H x W) per experiment -> ONE feature row.
# Per-experiment aggregation (NOT per-frame) avoids data leakage on small,
# highly-correlated frame sequences.
thermal_field_features:
  high_temp_threshold: 800.0    # Celsius; melt-pool / high-temperature zone
  haz_threshold: 700.0          # Celsius; heat-affected-zone boundary
  pixel_size_mm: 0.03128           # LEGACY pilot value (95.9 px = 3 mm). NOT the formal
                                   # scale. Formal processing uses configs/physical_calibration.yaml
                                   # (150.2 px = 5 mm -> 0.0332889481 mm/px). Kept only so the
                                   # existing feature/section tests still resolve a value.
  frame_rate_fps: 52          # for cooling-rate / dwell-time (seconds)
  center_threshold: 800.0       # threshold for the temperature-weighted center
  smooth_window: 5              # moving-average window for rate features
  input_dir: "data/processed/roi"
  output_table: "results/tables/thermal_field_features.csv"

# --- Quality labels (from substrate cross-section measurements) ---
# Label files are local-only (data/metadata, git-ignored). See
# docs/quality_label_template.md.
quality_labels:
  label_file_csv: "data/metadata/quality_labels.csv"
  label_file_excel: "data/metadata/quality_labels.xlsx"
  quality_rule:
    dilution_rate_min: 0.30
    dilution_rate_max: 0.50
    aspect_ratio_min: 3.0
    aspect_ratio_max: 6.0
    wetting_angle_min: 30.0
    wetting_angle_max: 55.0

# --- ML quality model (script 12) ---
ml_quality:
  task: "classification"        # classification | regression
  target: "quality_label"       # classification target, or a regression column
  cv: "leave_one_out"           # leave_one_out | stratified_kfold
  n_splits: 5                   # used only when cv == stratified_kfold
  random_state: 42
  models:
    - rf
    - svm
    - knn
    - logistic_regression
  dataset_table: "results/tables/ml_quality_dataset.csv"
  output_metrics: "results/tables/ml_quality_metrics.csv"
  output_predictions: "results/tables/ml_quality_predictions.csv"
  output_feature_importance: "results/tables/ml_feature_importance.csv"

# ============================================================
# Section-level ML quality prediction (scripts 13 -> 14 -> 15 -> 16)
# Workflow:  01 -> 02b -> 02 -> 03 -> 13 -> 14 -> 15 -> 16
#
# The ML SAMPLE UNIT is a CROSS-SECTION position (e.g. R01_T1_S1), NOT a frame.
# Features = process parameters + LOCAL thermal-field descriptors around the
# section's frame window. To avoid data leakage on highly-correlated frames,
# every cross-section that belongs to the same experiment_id is one GROUP, and
# train/test splits use GroupKFold / LeaveOneGroupOut on experiment_id — never
# a random shuffle of sections.
# ============================================================

# --- Section sampling plan + local feature extraction (script 13) ---
section_samples:
  section_plan_csv: "data/metadata/section_plan.csv"   # LOCAL, git-ignored
  local_feature_output: "results/tables/local_section_features.csv"
  default_travel_distance_mm: 30.0     # used when a plan row omits travel_distance_mm
  default_window_half_frames: 10       # used when a plan row omits window_half_frames
  default_window_half_mm: null         # optional mm-based half window
  use_window_half_mm: false            # true -> derive half_frames from *_mm + travel

# --- Section quality labels + dataset build (script 14) ---
# NOTE: here dilution_rate is a PERCENT (D/(D+H)*100), so the rule bounds are
# 30..50 (percent), unlike the experiment-level fraction rule (0.30..0.50).
section_quality_labels:
  label_file_csv: "data/metadata/section_quality_labels.csv"     # LOCAL, git-ignored
  label_file_excel: "data/metadata/section_quality_labels.xlsx"  # LOCAL, git-ignored
  output_dataset: "results/tables/section_ml_dataset.csv"
  quality_rule:
    dilution_rate_min: 30.0
    dilution_rate_max: 50.0
    aspect_ratio_min: 3.0
    aspect_ratio_max: 6.0
    wetting_angle_min: 30.0
    wetting_angle_max: 55.0

# --- Section ML training + evaluation (script 15) ---
section_ml:
  dataset_csv: "results/tables/section_ml_dataset.csv"
  group_column: "experiment_id"      # leakage guard: split groups are experiments
  sample_id_column: "sample_id"
  random_state: 42
  cv: "group_kfold"                  # group_kfold | leave_one_group_out
  n_splits: 5
  # Three input-feature sets compared head-to-head.
  input_sets:
    process_only:
      - laser_power_W
      - scan_speed_mm_min
      - powder_feed_g_min
      - magnetic_field_mT
    thermal_only:
      - local_peak_temperature
      - local_mean_temperature
      - local_temperature_fluctuation
      - local_high_temp_area_mean
      - local_high_temp_area_max
      - local_haz_width_mean
      - local_haz_width_max
      - local_gradient_mean
      - local_gradient_max
      - local_cooling_rate_mean
      - local_cooling_rate_max_abs
      - local_center_offset_mean
      - local_center_offset_max
      - local_dwell_time
      - local_temperature_auc
    fused:
      - laser_power_W
      - scan_speed_mm_min
      - powder_feed_g_min
      - magnetic_field_mT
      - local_peak_temperature
      - local_mean_temperature
      - local_temperature_fluctuation
      - local_high_temp_area_mean
      - local_high_temp_area_max
      - local_haz_width_mean
      - local_haz_width_max
      - local_gradient_mean
      - local_gradient_max
      - local_cooling_rate_mean
      - local_cooling_rate_max_abs
      - local_center_offset_mean
      - local_center_offset_max
      - local_dwell_time
      - local_temperature_auc
  regression_targets:
    - dilution_rate
    - aspect_ratio
    - wetting_angle_avg
    - wetting_angle_diff
  classification_target: "quality_label"
  regression_models:
    - ridge
    - svr
    - random_forest
    - knn
  classification_models:
    - logistic_regression
    - svm
    - random_forest
    - knn
  output_regression_metrics: "results/tables/section_ml_regression_metrics.csv"
  output_regression_predictions: "results/tables/section_ml_regression_predictions.csv"
  output_classification_metrics: "results/tables/section_ml_classification_metrics.csv"
  output_classification_predictions: "results/tables/section_ml_classification_predictions.csv"
  output_feature_importance: "results/tables/section_ml_feature_importance.csv"
  output_figures_dir: "results/figures/section_ml"
